<div class="forklift-container" [attr.data-state]="state">
  <!-- SVG Forklift -->
  <svg class="forklift-svg" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Forklift Body -->
    <g class="forklift-body">
      <!-- Main cabin -->
      <rect x="60" y="60" width="60" height="50" fill="#f97316" stroke="#c2410c" stroke-width="2" rx="4"/>
      
      <!-- Cabin window -->
      <rect x="70" y="70" width="40" height="25" fill="#38bdf8" opacity="0.6" stroke="#0284c7" stroke-width="1" rx="2"/>
      
      <!-- Roof -->
      <rect x="55" y="55" width="70" height="8" fill="#ea580c" stroke="#9a3412" stroke-width="1" rx="2"/>
      
      <!-- Front part -->
      <rect x="120" y="85" width="25" height="25" fill="#fb923c" stroke="#c2410c" stroke-width="2" rx="2"/>
      
      <!-- Counterweight -->
      <rect x="35" y="85" width="30" height="25" fill="#44403c" stroke="#1c1917" stroke-width="2" rx="2"/>
    </g>

    <!-- Wheels -->
    <g class="wheels">
      <!-- Back wheel -->
      <circle cx="50" cy="115" r="8" fill="#1f2937" stroke="#111827" stroke-width="2" class="wheel back-wheel"/>
      <circle cx="50" cy="115" r="4" fill="#6b7280"/>
      
      <!-- Front wheel -->
      <circle cx="130" cy="115" r="8" fill="#1f2937" stroke="#111827" stroke-width="2" class="wheel front-wheel"/>
      <circle cx="130" cy="115" r="4" fill="#6b7280"/>
    </g>

    <!-- Mast (vertical part) -->
    <g class="mast">
      <rect x="145" y="40" width="6" height="75" fill="#64748b" stroke="#475569" stroke-width="1"/>
      <rect x="155" y="40" width="6" height="75" fill="#64748b" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Forks (moving part) -->
    <g class="forks" [attr.transform]="'translate(0, ' + getForkYPosition() + ')'">
      <!-- Fork 1 -->
      <rect x="162" y="-50" width="30" height="4" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
      <!-- Fork 2 -->
      <rect x="162" y="-42" width="30" height="4" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
      
      <!-- Carriage -->
      <rect x="145" y="-52" width="18" height="12" fill="#475569" stroke="#334155" stroke-width="1"/>
      
      <!-- Load (if present) -->
      <g *ngIf="hasLoad()" class="load">
        <rect x="162" y="-80" width="28" height="25" fill="#78716c" stroke="#57534e" stroke-width="2" rx="2"/>
        <text x="176" y="-63" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">
          {{ loadWeight }}kg
        </text>
      </g>
    </g>

    <!-- Battery Indicator -->
    <g class="battery-indicator">
      <rect x="10" y="10" width="30" height="15" fill="white" stroke="#374151" stroke-width="2" rx="2"/>
      <rect x="40" y="13" width="3" height="9" fill="#374151" rx="1"/>
      <rect x="12" y="12" [attr.width]="(batteryLevel / 100) * 26" height="11" [attr.fill]="getBatteryColor()" rx="1"/>
      <text x="25" y="20" font-size="8" fill="#000" text-anchor="middle" font-weight="bold">
        {{ batteryLevel }}%
      </text>
    </g>

    <!-- State Indicator -->
    <g class="state-indicator">
      <text x="10" y="135" font-size="10" fill="#fff" font-weight="bold">
        State: {{ state.toUpperCase() }}
      </text>
    </g>
  </svg>
</div>
